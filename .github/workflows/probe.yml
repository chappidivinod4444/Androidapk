name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          set +e
          curl -s https://raw.githubusercontent.com/MuntashirAkon/libadb-android/master/README.md | tail -c +3900 | sed 's/^/RD /'
          B=https://jitpack.io/com/github/MuntashirAkon/libadb-android/3.1.1
          curl -s $B/libadb-android-3.1.1.pom | sed 's/^/PM /'
          curl -sL -o l.aar $B/libadb-android-3.1.1.aar; ls -la l.aar
          mkdir a && cd a && unzip -q ../l.aar && find . -type f | sed 's/^/FL /'
          mkdir c && cd c && unzip -q ../classes.jar
          for f in $(find . -name '*.class' | sort); do javap -public "$f" 2>/dev/null | sed 's/^/JP /'; done
