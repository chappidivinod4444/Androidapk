name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://search.maven.org/solrsearch/select?q=libadb&rows=20&wt=json" | python3 -c "import sys,json;[print('HIT',d['id'],d.get('latestVersion')) for d in json.load(sys.stdin)['response']['docs']]"
          curl -s "https://search.maven.org/solrsearch/select?q=g:io.github.muntashirakon&rows=40&wt=json" | python3 -c "import sys,json;[print('HIT',d['id'],d.get('latestVersion')) for d in json.load(sys.stdin)['response']['docs']]"
          curl -s https://repo1.maven.org/maven2/io/github/muntashirakon/ | grep -o 'href="[^"]*' | sed 's/^/DIR /'
